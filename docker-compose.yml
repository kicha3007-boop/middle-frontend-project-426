# Локальный стенд: PostgreSQL и приложение из того же Dockerfile, что и в проде.
# docker compose up --build → http://localhost:8080
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      args:
        VITE_MONITORING_DSN: ${VITE_MONITORING_DSN:-}
    environment:
      PORT: 8080
      DATABASE_URL: postgres://store:store@db:5432/store
      MONITORING_DSN: ${MONITORING_DSN:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
